[package]
name = "codescape-server"
description = "Codescape server: actix-web on its own port (4100) with the frozen V3/V5 position wire, /wss emulation for the XR client, JSON events, presence ingest, voice adapters and the static desktop bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "codescape_server"
path = "src/lib.rs"

[[bin]]
name = "codescape-server"
path = "src/main.rs"

[features]
default = []
cuda = ["codescape-layout/cuda"]

[dependencies]
codescape-model = { workspace = true }
codescape-ingest = { workspace = true }
codescape-layout = { workspace = true }
codescape-collab = { workspace = true }
actix-web = { workspace = true }
actix-ws = { workspace = true }
actix-files = { workspace = true }
actix-cors = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
crossbeam-channel = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
mime_guess = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
