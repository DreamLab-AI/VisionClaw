# Codescape — a separate Cargo workspace (ADR-2143).
#
# Why separate: the graphicle engine enables serde_json `arbitrary_precision` and
# `preserve_order`, pins exact versions of unicode-normalization and smallvec, and
# drags neo4rs/redis/reqwest in unconditionally. Feature unification would change
# number handling for every crate in the VisionClaw root workspace, so Codescape
# resolves its own lock and builds into its own target dir
# (`CARGO_TARGET_DIR=/app/target/codescape` in the container).
#
# Isolation from the knowledge-work system is a tested property, not a convention:
# `codescape-server/tests/isolation.rs` fails the build graph on any forbidden crate.
[workspace]
resolver = "2"
members = [
    "codescape-model",
    "codescape-ingest",
    "codescape-layout",
    "codescape-collab",
    "codescape-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
authors = ["jjohare <github@thedreamlab.uk>"]
repository = "https://github.com/DreamLab-AI/AR-AI-Knowledge-Graph"
publish = false

[workspace.dependencies]
codescape-model = { path = "codescape-model", version = "0.1.0" }
codescape-ingest = { path = "codescape-ingest" }
codescape-layout = { path = "codescape-layout" }
codescape-collab = { path = "codescape-collab", version = "0.1.0" }
# The frozen V3/V5 position wire, shared with the VisionClaw clients (dependency-free,
# MIT OR Apache-2.0). Path today; version-only once published to crates.io.
visionclaw-wire = { path = "../visionclaw-wire", version = "0.1.0" }

# The code-graph engine: Graphify 0.9.91 ported to Rust (Apache-2.0). Pinned to a
# revision; a bump is an explicit change. Default features (chinese, precise-js,
# grammars-extra) are off; never enable `transcription` or `bedrock`.
graphicle = { git = "https://github.com/Graphicle-AI/graphicle", rev = "003f93605d895ed69f0cf06690dd296474385b99", default-features = false }
# graphicle's manifest warns 0.26 changes error-recovery output; hold the line.
tree-sitter = "=0.25.10"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal"] }
rayon = "1.10"
parking_lot = "0.12"
bytes = "1"
rand = "0.8"
rand_chacha = "0.3"
notify = "7"
walkdir = "2"
ignore = "0.4"
crossbeam-channel = "0.5"
dashmap = "6"
indexmap = "2"
smallvec = "=1.16.1"
unicode-normalization = "=0.1.22"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
ipnet = "2"
base64 = "0.22"
futures-util = "0.3"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
actix-web = { version = "4.11", features = ["rustls-0_23"] }
actix-ws = "0.3"
actix-files = "0.6"
actix-cors = "0.7"
rustls = "0.23"
rustls-pemfile = "2"
nostr = { version = "0.39", default-features = false, features = ["std", "nip98"] }
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
tempfile = "3"
proptest = "1"
criterion = "0.5"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 8

[profile.dev.package."*"]
opt-level = 2

# The ingest hot path (graphicle patch → model mapping → delta) must stay under
# a second per changed file even in `cargo test`; unoptimised it takes ~1.5 s.
[profile.dev.package.codescape-ingest]
opt-level = 2

[profile.dev.package.codescape-model]
opt-level = 2
