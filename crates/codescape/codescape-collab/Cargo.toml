[package]
name = "codescape-collab"
description = "Codescape collaboration state: actor registry, activity heat, path-to-node resolution, the single-floor push-to-talk arbiter and the voice/typed command grammar that yields a typed Command AST. I/O-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository = "https://github.com/DreamLab-AI/codescape"
homepage = "https://github.com/DreamLab-AI/codescape"
documentation = "https://docs.rs/codescape-collab"
readme = "README.md"
keywords = ["voice-commands", "grammar", "collaboration", "presence", "codescape"]
categories = ["parser-implementations", "data-structures"]
publish = true

[dependencies]
codescape-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
