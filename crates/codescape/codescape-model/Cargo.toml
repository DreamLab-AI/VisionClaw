[package]
name = "codescape-model"
description = "Codescape code-graph domain model: nodes, edges, interned wire ids, snapshots, deltas, LOD tiers, community matching and the frozen V3 record mapping. I/O-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository = "https://github.com/DreamLab-AI/codescape"
homepage = "https://github.com/DreamLab-AI/codescape"
documentation = "https://docs.rs/codescape-model"
readme = "README.md"
keywords = ["code-graph", "visualisation", "graph", "wire-protocol", "codescape"]
categories = ["data-structures", "visualization"]
publish = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
visionclaw-wire = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
