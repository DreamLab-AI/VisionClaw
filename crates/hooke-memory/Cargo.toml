[package]
name = "hooke-memory"
version = "0.1.0"
edition = "2021"
description = "Physics-structured latent memory for a frozen LLM: a Rust port of Memorilla's memory module with relational-field slot geometry"
license = "Apache-2.0"
publish = false

# Standalone: kept out of the VisionClaw workspace so the CUDA stack never touches the main lockfile.
[workspace]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.1", features = ["cuda"] }
candle-nn = { version = "0.11.1", features = ["cuda"] }
half = "2"
memmap2 = "0.9"
parquet = { version = "55", default-features = false, features = ["snap", "zstd", "flate2", "lz4"] }
rand = "0.8"
rand_distr = "0.4"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
debug = false

# candle-core 0.11.1 with two changes in src/backprop.rs (matmul backward skips untracked operands;
# backward returns only variable gradients); see PORTING.md.
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
