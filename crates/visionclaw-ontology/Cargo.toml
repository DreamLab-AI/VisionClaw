[package]
name = "visionclaw-ontology"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "VisionClaw ontology crate: OWL parsing, inference, JSON-LD validation, reasoning (ADR-090 Phase A4)"
authors = ["jjohare <github@thedreamlab.uk>"]
repository = "https://github.com/jjohare/AR-AI-Knowledge-Graph"

[lib]
path = "src/lib.rs"

[dependencies]
# Domain crate — port traits (OntologyRepository, InferenceEngine, GraphRepository) + models
visionclaw-domain = { path = "../visionclaw-domain" }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"

# Async
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
futures = "0.3"

# OWL / ontology libs
horned-owl = { version = "1.2.0", features = ["remote"] }
whelk = { git = "https://github.com/jjohare/whelk-rs", rev = "79a1ee21789add5a66faa0ec1a830c32dba9b539" }

# Utilities
regex = "1.11"
once_cell = "1.20"
# Diacritic-preserving slugifier (ADR-100 D2): NFKD + combining-mark strip.
# Already in the workspace lock as a transitive dep — adding it as a direct
# dependency does not change the resolved graph.
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
blake3 = "1.5"
dashmap = "6.1"
lru = "0.16.3"
sha2 = "0.10"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Persistence — Oxigraph quad-store (required; ingest pipeline emits Quads)
oxigraph = { version = "0.4" }

[dev-dependencies]
# Test-only: the crate's existing `#[tokio::test]` units need the macro +
# multi-thread runtime, which the production dependency intentionally omits.
# Scoped to dev so the production dep surface is unchanged.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = []

[lints]
