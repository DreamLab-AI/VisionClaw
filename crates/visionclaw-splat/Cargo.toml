[package]
name = "visionclaw-splat"
version = "0.1.0"
edition = "2021"
description = "Gaussian splat asset contract for VisionClaw (ADR-2170): the splat manifest, the licence admission rule, sha256-12 content addressing, the content-addressed cache and the SPZ v3 codec, shared by the server and the Quest XR client."
authors = ["jjohare <github@thedreamlab.uk>"]
# MIT, not the server's AGPL: the Quest XR client (MIT) links this crate.
license = "MIT"
repository = "https://github.com/DreamLab-AI/VisionClaw"
# Project-specific asset contract (ADR-2170), not a reusable format.
publish = false

[features]
default = []
# The `splat-admit` operator CLI: fetches sources and runs splat-transform.
cli = ["dep:ureq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
# Pure-Rust miniz backend: SPZ v3 is one gzip stream, and the Android build
# must not pull a C zlib.
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
ureq = { version = "2.12", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "splat-admit"
path = "src/bin/splat_admit.rs"
required-features = ["cli"]
