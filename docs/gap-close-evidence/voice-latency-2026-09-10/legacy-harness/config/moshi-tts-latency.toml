# Isolated single-session candidate. Same model/CFG as current batch-two service.
static_dir = "./static/"
log_dir = "/tmp/voice-latency-logs"
instance_name = "tts-latency"
authorized_ids = ["public_token"]

[modules.tts_py]
type = "Py"
path = "/api/tts_streaming"
text_tokenizer_file = "hf://kyutai/tts-1.6b-en_fr/tokenizer_spm_8k_en_fr_audio.model"
batch_size = 1
text_bos_token = 1

[modules.tts_py.py]
log_folder = "/tmp/voice-latency-logs"
voice_folder = "hf-snapshot://kyutai/tts-voices/**/*.safetensors"
default_voice = "unmute-prod-website/default_voice.wav"
cfg_coef = 2.0
cfg_is_no_text = true
padding_between = 1
n_q = 24
