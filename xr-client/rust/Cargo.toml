# Standalone workspace root: this cdylib targets the Quest 3 APK and pulls in
# the heavy `godot` (gdext) toolchain, so it is deliberately isolated from the
# visionclaw-server workspace (which `exclude`s this path). Keeps server builds
# from compiling the GDExtension bindings and gives this crate its own target dir.
[workspace]
# The perf regression checker is its own tiny package so that building it does
# not drag in the `godot` gdext toolchain this cdylib needs.
members = ["perf-regression"]

[package]
name = "visionclaw-xr-gdext"
version = "0.2.1"
edition = "2021"
description = "GDExtension hot-path crate for the VisionClaw Quest 3 native APK XR client (PRD-008). Owns binary protocol decode, presence WS, hand interaction, LOD policy, and spatial voice routing as godot-rust classes consumed by the Godot 4.3 scene tree."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = "0.2"
visionclaw-xr-presence = { path = "../../crates/visionclaw-xr-presence" }
# ADR-2135: the separated-layout triangle, the same crate the server projects with.
visionclaw-tri-layout = { path = "../../crates/visionclaw-tri-layout" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = "0.21"
bytes = "1.10"
tracing = "0.1"
tracing-android = "0.2"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.34"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
sha2 = "0.10"
hex = "0.4"
# CLOCK_THREAD_CPUTIME_ID for the pack timing gate (thread_cpu.rs); already in
# the tree via tokio, declared directly because it is used directly.
libc = "0.2"

[dev-dependencies]
# The server's NIP-98 decoder (`src/utils/nip98.rs`) parses and verifies with
# nostr-sdk 0.43's `nostr`; the signer tests check the headset's events against
# the same crate rather than a test-only reimplementation.
nostr = "0.43"
mockall = "0.13"
proptest = "1.5"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode_throughput"
harness = false

# The editor and the desktop-OpenXR headset run (`godot --path xr-client …`)
# load the *debug* library (visionclaw_xr_gdext.gdextension maps
# linux.debug.x86_64 → target/debug), so an unoptimised dev profile is what the
# headset actually runs. Measured on HP 2026-10-07 (perf/benchmark_scene.tscn,
# 13 164 nodes): the per-frame node pack took 18–20 ms unoptimised vs 1.8 ms
# optimised — the difference between missing and holding 90 fps. Debug
# assertions and overflow checks stay on; only codegen is optimised.
[profile.dev]
opt-level = 2
