name: Ontology Federation CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'ontology/**'
      - 'public/ontology/**'
      - '.github/workflows/ontology-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ontology/**'
      - 'public/ontology/**'
  repository_dispatch:
    types: [logseq-sync]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository for ontology (e.g., jjohare/visionGraph)'
        required: false
        default: 'jjohare/visionGraph'
      force_sync:
        description: 'Force full sync even if no changes detected'
        required: false
        default: 'false'
        type: boolean

env:
  ONTOLOGY_SOURCE_REPO: ${{ github.event.inputs.source_repo || 'jjohare/visionGraph' }}
  # ADR-2098: solid-pod-rs is embedded in the VisionClaw server (ADR-032 M3) and
  # the JSS sidecar is gone from docker-compose.unified.yml — there is no `jss`
  # host left to resolve, so the old default could only ever fail DNS. The pod is
  # served in-process under the `/solid` scope on the server's own listener
  # (`src/handlers/solid_proxy_handler.rs`, `SYSTEM_NETWORK_PORT`, default 4000).
  # Set the `SOLID_POD_URL` repository variable to the reachable base URL for the
  # target deployment; this default names the in-process endpoint.
  SOLID_POD_URL: ${{ vars.SOLID_POD_URL || 'http://localhost:4000/solid' }}
  JSS_PUBLIC_PATH: /public/ontology
  CACHE_DIR: .ontology-cache
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  validate-source:
    name: Validate Ontology Source
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      changed_files: ${{ steps.detect.outputs.changed_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      # The ontology source is a PRIVATE repository owned by another account
      # (jjohare/visionGraph). The automatic GITHUB_TOKEN is scoped to this repository
      # alone, so it can never read it: actions/checkout retries three times and
      # then reports only the opaque
      #   "Not Found - https://docs.github.com/rest/repos/repos#get-a-repository"
      # which is why this workflow has failed on every run since 2025-12-31.
      # Name the missing credential before we hit that wall.
      - name: Verify ontology source access
        env:
          GH_TOKEN: ${{ secrets.ONTOLOGY_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.ONTOLOGY_SOURCE_TOKEN != '' }}
        run: |
          if gh repo view "$ONTOLOGY_SOURCE_REPO" --json nameWithOwner >/dev/null 2>&1; then
            echo "✓ $ONTOLOGY_SOURCE_REPO is readable"
            exit 0
          fi
          echo "::error title=Ontology source unreachable::Cannot read $ONTOLOGY_SOURCE_REPO"
          if [ "$HAVE_PAT" != "true" ]; then
            echo "No ONTOLOGY_SOURCE_TOKEN secret is set, so this job fell back to the"
            echo "automatic GITHUB_TOKEN, which is scoped to ${{ github.repository }} only"
            echo "and cannot read a private repository owned by another account."
            echo ""
            echo "OPS ACTION: create a fine-grained PAT with Contents: read on"
            echo "$ONTOLOGY_SOURCE_REPO and add it to ${{ github.repository }} as the"
            echo "repository secret ONTOLOGY_SOURCE_TOKEN."
          else
            echo "ONTOLOGY_SOURCE_TOKEN is set but cannot read $ONTOLOGY_SOURCE_REPO."
            echo "Check that it has not expired and grants Contents: read on that repository."
          fi
          exit 1

      - name: Checkout ontology source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.ONTOLOGY_SOURCE_REPO }}
          path: logseq-source
          token: ${{ secrets.ONTOLOGY_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: detect
        run: |
          cd logseq-source

          # Get current SHA
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT

          # Find markdown files with ontology content
          CHANGED_FILES=$(find . -name "*.md" -type f | head -100)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if we have ontology content
          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=${{ github.event.inputs.force_sync || 'false' }}" >> $GITHUB_OUTPUT
          fi

      - name: Cache previous state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CACHE_DIR }}
          key: ontology-state-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ontology-state-${{ runner.os }}-

  # One converter, the vault's own. The two jobs this replaces (convert-ontology
  # and convert-jsonld, an inline md_to_ttl.py plus an rdflib→pyld re-serialise)
  # read Logseq `key:: value` lines and never looked at the fenced json-ld block
  # that carries every page's identity and typing in the ADR-2040 vault format.
  # Run 34045488066 was the first to get past the source preflight and shipped
  # 380 untyped nodes and 0 owl:Class under an example.org vocabulary, with
  # valid syntax and matching digests. jjohare/visionGraph's pipeline.build is
  # what narrativegoldmine.com publishes from (8,4xx classes, ~265k triples,
  # public-only, narrativegoldmine.com IRIs); the pod now holds exactly that.
  build-ontology:
    name: Build ontology (vault pipeline)
    runs-on: ubuntu-latest
    needs: validate-source
    if: needs.validate-source.outputs.has_changes == 'true'
    outputs:
      ttl_sha: ${{ steps.pack.outputs.ttl_sha }}
      jsonld_sha: ${{ steps.pack.outputs.jsonld_sha }}
      context_sha: ${{ steps.pack.outputs.context_sha }}
      conversion_status: ${{ steps.pack.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout ontology source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.ONTOLOGY_SOURCE_REPO }}
          path: logseq-source
          token: ${{ secrets.ONTOLOGY_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          # no pip cache: setup-python keys it on a requirements file this repo does not have

      # The vault pipeline's only third-party import; pinned floor matches
      # visionGraph/.github/workflows/publish.yml.
      - name: Install rdflib
        run: pip install "rdflib>=7.0.0"

      - name: Run the vault's JSON-LD publishing pipeline
        working-directory: logseq-source
        run: |
          python -m pipeline.build knowledge/pages "$GITHUB_WORKSPACE/output/vault"

      # Copies the public-only Turtle, compacts it to JSON-LD against the
      # vault's context, writes the LDP index manifest, and refuses to pack an
      # ontology below the substance floor (scripts/ontology/pack-pod-resources.py).
      - name: Pack pod resources
        id: pack
        env:
          ONTOLOGY_SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          python scripts/ontology/pack-pod-resources.py output/vault output/pod

      - name: Validate packed resources
        run: |
          python - <<'PY'
          import json
          from rdflib import Graph
          g = Graph()
          g.parse('output/pod/ontology-ttl/visionflow.ttl', format='turtle')
          print(f'Turtle re-parses: {len(g)} triples')
          with open('output/pod/ontology-jsonld/ontology.jsonld') as f:
              ld = json.load(f)
          assert '@context' in ld and ld.get('@graph'), 'ontology.jsonld lacks @context/@graph'
          print(f'JSON-LD: {len(ld["@graph"])} graph nodes')
          with open('output/pod/ontology-jsonld/index.jsonld') as f:
              manifest = json.load(f)
          assert len(manifest['ldp:contains']) == 3, 'manifest must list three resources'
          print(f'Manifest: {manifest["visionflow:classes"]} classes, {manifest["visionflow:triples"]} triples')
          PY

      - name: Upload TTL artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-ttl
          path: output/pod/ontology-ttl/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload JSON-LD artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ontology-jsonld
          path: output/pod/ontology-jsonld/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ADR-2106 pull model. A hosted runner cannot reach the in-process pod, so
  # the resources are attached to the rolling release `ontology-latest` and
  # the server pulls them at boot (src/services/ontology_pull.rs), verifying
  # every file against SHA256SUMS. The release tag is moved to the current
  # commit on each publish; assets are replaced with --clobber.
  publish-release:
    name: Publish ontology-latest release
    runs-on: ubuntu-latest
    needs: [validate-source, build-ontology]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ontology-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/ontology-ttl/visionflow.ttl \
             artifacts/ontology-ttl/visionflow.stats.json \
             artifacts/ontology-jsonld/context.jsonld \
             artifacts/ontology-jsonld/ontology.jsonld \
             artifacts/ontology-jsonld/index.jsonld \
             release/
          cd release
          sha256sum visionflow.ttl visionflow.stats.json context.jsonld ontology.jsonld index.jsonld > SHA256SUMS
          cat SHA256SUMS

      - name: Create or move the release tag
        run: |
          set -euo pipefail
          notes="Ontology pod resources built by ontology-publish.yml run ${{ github.run_number }}.

          - build: ${{ github.sha }}
          - source: ${{ env.ONTOLOGY_SOURCE_REPO }} @ ${{ needs.validate-source.outputs.source_sha }}
          - classes / triples: see index.jsonld (visionflow:classes, visionflow:triples)

          Consumed by the VisionClaw server at boot (ADR-2106, ONTOLOGY_PULL_URL). Assets are verified against SHA256SUMS before any write."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "${{ github.sha }}" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "Ontology pod resources (rolling)" --notes "$notes" --prerelease --latest=false
          fi
          # The tag object must follow the release target; `gh release edit --target`
          # only moves it when no tag exists yet, so move it explicitly.
          git tag -f "$RELEASE_TAG" "${{ github.sha }}"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Upload assets
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)B"'

      - name: Verify the public download path (what the server will fetch)
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base/SHA256SUMS" -o /tmp/SHA256SUMS; then break; fi
            sleep 10
          done
          diff <(sort release/SHA256SUMS) <(sort /tmp/SHA256SUMS)
          curl -fsSL "$base/index.jsonld" | python3 -c 'import sys,json; m=json.load(sys.stdin); print("public manifest:", m["visionflow:buildSha"], m["visionflow:classes"], "classes")'

  deploy-jss:
    name: Deploy to JSS
    runs-on: ubuntu-latest
    needs: build-ontology
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SOLID_POD_URL != ''
    environment: production
    outputs:
      deployment_status: ${{ steps.deploy.outputs.status }}
      rollback_sha: ${{ steps.backup.outputs.rollback_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      - name: Backup current state
        id: backup
        continue-on-error: true
        run: |
          mkdir -p backup

          # Fetch current index for rollback reference
          ROLLBACK_SHA=""
          if curl -sf "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/index.jsonld" -o backup/index.jsonld; then
            ROLLBACK_SHA=$(jq -r '.["visionflow:buildSha"] // empty' backup/index.jsonld)
          fi

          echo "rollback_sha=$ROLLBACK_SHA" >> $GITHUB_OUTPUT
          echo "Previous deployment SHA: $ROLLBACK_SHA"

      - name: Deploy to JSS
        id: deploy
        run: |
          set -e

          SOLID_POD_URL="${{ env.SOLID_POD_URL }}"
          PUBLIC_PATH="${{ env.JSS_PUBLIC_PATH }}"

          echo "Deploying to $SOLID_POD_URL$PUBLIC_PATH"

          # Create container if not exists
          curl -X PUT "$SOLID_POD_URL$PUBLIC_PATH/" \
            -H "Content-Type: text/turtle" \
            -H "Link: <http://www.w3.org/ns/ldp#BasicContainer>; rel=\"type\"" \
            --fail-with-body || true

          # Deploy TTL
          echo "Uploading visionflow.ttl..."
          curl -X PUT "$SOLID_POD_URL$PUBLIC_PATH/visionflow.ttl" \
            -H "Content-Type: text/turtle" \
            --data-binary @artifacts/ontology-ttl/visionflow.ttl \
            --fail-with-body

          # Deploy JSON-LD files
          for file in context.jsonld ontology.jsonld index.jsonld; do
            echo "Uploading $file..."
            curl -X PUT "$SOLID_POD_URL$PUBLIC_PATH/$file" \
              -H "Content-Type: application/ld+json" \
              --data-binary @artifacts/ontology-jsonld/$file \
              --fail-with-body
          done

          echo "status=success" >> $GITHUB_OUTPUT
          echo "Deployment completed successfully"

      - name: Verify deployment
        run: |
          SOLID_POD_URL="${{ env.SOLID_POD_URL }}"
          PUBLIC_PATH="${{ env.JSS_PUBLIC_PATH }}"

          echo "Verifying deployment..."

          # Check each resource
          for file in index.jsonld context.jsonld ontology.jsonld visionflow.ttl; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SOLID_POD_URL$PUBLIC_PATH/$file")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Failed to verify $file (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "Verified: $file (HTTP $HTTP_CODE)"
          done

          # Verify SHA1 matches
          DEPLOYED_INDEX=$(curl -sf "$SOLID_POD_URL$PUBLIC_PATH/index.jsonld")
          DEPLOYED_SHA=$(echo "$DEPLOYED_INDEX" | jq -r '.["visionflow:buildSha"]')

          if [ "$DEPLOYED_SHA" == "${{ github.sha }}" ]; then
            echo "SHA verification passed: $DEPLOYED_SHA"
          else
            echo "WARNING: SHA mismatch - expected ${{ github.sha }}, got $DEPLOYED_SHA"
          fi

      - name: Rollback on failure
        if: failure() && steps.backup.outputs.rollback_sha != ''
        run: |
          echo "Deployment failed, attempting rollback to ${{ steps.backup.outputs.rollback_sha }}"

          # Restore from backup
          if [ -f backup/index.jsonld ]; then
            curl -X PUT "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/index.jsonld" \
              -H "Content-Type: application/ld+json" \
              --data-binary @backup/index.jsonld || true
          fi

          echo "Rollback attempted - manual verification required"

  notify-websocket:
    name: Send WebSocket Notification
    runs-on: ubuntu-latest
    needs: deploy-jss
    if: needs.deploy-jss.outputs.deployment_status == 'success'

    steps:
      - name: Send ontology update notification
        run: |
          # Construct notification payload
          NOTIFICATION=$(cat << EOF
          {
            "type": "ontology_updated",
            "data": {
              "source": "github-actions",
              "repository": "${{ env.ONTOLOGY_SOURCE_REPO }}",
              "buildSha": "${{ github.sha }}",
              "buildNumber": "${{ github.run_number }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "resources": {
                "index": "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/index.jsonld",
                "ontology": "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/ontology.jsonld",
                "context": "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/context.jsonld",
                "ttl": "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/visionflow.ttl"
              },
              "hashes": {
                "ttl": "${{ needs.build-ontology.outputs.ttl_sha }}",
                "jsonld": "${{ needs.build-ontology.outputs.jsonld_sha }}",
                "context": "${{ needs.build-ontology.outputs.context_sha }}"
              }
            }
          }
          EOF
          )

          echo "Notification payload:"
          echo "$NOTIFICATION" | jq .

          # ADR-2098: `/.notifications` on the embedded pod is a GET WebSocket
          # upgrade (solid-0.1 protocol), NOT a POST trigger — the JSS sidecar's
          # POST-to-broadcast endpoint went away with the sidecar. Subscribers are
          # notified by the pod itself on the LDP writes above, so this POST is a
          # best-effort no-op kept only for a deployment still fronted by JSS.
          curl -X POST "${{ env.SOLID_POD_URL }}/.notifications" \
            -H "Content-Type: application/json" \
            -d "$NOTIFICATION" || echo "Direct notification endpoint not available (expected on the embedded pod)"

          # Alternative: Touch the index to trigger LDP notification
          curl -X PATCH "${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/index.jsonld" \
            -H "Content-Type: application/sparql-update" \
            -d "INSERT DATA { <> <http://purl.org/dc/terms/modified> \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"^^<http://www.w3.org/2001/XMLSchema#dateTime> }" || true

          echo "WebSocket notification triggered"

      - name: Create deployment summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Ontology Federation Deployment

          **Status**: Deployed successfully
          **Build**: #${{ github.run_number }}
          **Commit**: \`${{ github.sha }}\`

          ### Resources Deployed

          | Resource | SHA1 | URL |
          |----------|------|-----|
          | TTL | \`${{ needs.build-ontology.outputs.ttl_sha }}\` | [${{ env.JSS_PUBLIC_PATH }}/visionflow.ttl](${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/visionflow.ttl) |
          | JSON-LD | \`${{ needs.build-ontology.outputs.jsonld_sha }}\` | [${{ env.JSS_PUBLIC_PATH }}/ontology.jsonld](${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/ontology.jsonld) |
          | Context | \`${{ needs.build-ontology.outputs.context_sha }}\` | [${{ env.JSS_PUBLIC_PATH }}/context.jsonld](${{ env.SOLID_POD_URL }}${{ env.JSS_PUBLIC_PATH }}/context.jsonld) |

          ### Pipeline
          \`\`\`
          jjohare/visionGraph -> Markdown -> TTL -> JSON-LD -> JSS -> WebSocket -> React
          \`\`\`

          WebSocket subscribers notified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

  pr-preview:
    name: PR Preview (Dry Run)
    runs-on: ubuntu-latest
    needs: build-ontology
    if: github.event_name == 'pull_request'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      - name: Generate PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');

            // Read manifest
            const manifest = JSON.parse(fs.readFileSync('artifacts/ontology-jsonld/index.jsonld', 'utf8'));

            // Read stats if available
            let stats = { triples: 'N/A', pages_processed: 'N/A' };
            try {
              stats = JSON.parse(fs.readFileSync('artifacts/ontology-ttl/visionflow.stats.json', 'utf8'));
            } catch (e) {}

            const comment = `## Ontology Conversion Preview

            **Conversion Status**: Success
            **TTL SHA1**: \`${{ needs.build-ontology.outputs.ttl_sha }}\`
            **JSON-LD SHA1**: \`${{ needs.build-ontology.outputs.jsonld_sha }}\`

            ### Statistics
            - Triples generated: ${stats.triples}
            - Pages processed: ${stats.pages_processed}
            - Resources in manifest: ${manifest['ldp:contains']?.length || 0}

            ### Preview Files
            Artifacts are available for download from the workflow run.

            **Note**: This is a dry run. Merge to \`main\` to deploy to JSS.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # deploy-jss is the PUSH path, only for a deployment whose pod is reachable
  # from a runner (vars.SOLID_POD_URL). The default delivery is the PULL model
  # (ADR-2106): publish-release above + the server's boot pull. This job makes
  # the skip legible in the run view.
  deploy-target-missing:
    name: Push deploy skipped (pull model in effect)
    runs-on: ubuntu-latest
    needs: [build-ontology, publish-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SOLID_POD_URL == ''
    steps:
      - run: |
          echo "::notice title=Push deploy skipped::vars.SOLID_POD_URL is unset, so deploy-jss did not run. The resources were published to the ontology-latest release and the VisionClaw server pulls them into /public/ontology/ at boot and every ONTOLOGY_PULL_INTERVAL_SECS (ADR-2106). Set vars.SOLID_POD_URL only for a pod a runner can reach."
