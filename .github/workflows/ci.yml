name: CI

# VisionClaw backend + client CI (closeout 2026-07-03, FINISH F1).
#
# This is the workflow the removed README "Build" badge used to point at — it
# never existed until now, so ~163 Rust test files and ~42 Vitest suites had
# zero regression protection on push/PR.
#
# Gating policy
# ------------
#   BLOCKING (real merge gates — never continue-on-error):
#     * rust-fmt          — cargo fmt --check across every crate
#     * rust-cpu          — build + clippy + test the CUDA-free workspace crates
#     * client            — the client Vitest unit/component suite
#     * dev-auth-release-gate — ADR-2037: asserts no production/release build
#       line (Dockerfile.production, Dockerfile.unified, prod-entrypoint.sh)
#       carries the dev-auth cargo feature. Hermetic grep, no cargo/docker
#       invocation — see ADR-2086 for the implementation record.
#
#   NON-BLOCKING (need a live stack — continue-on-error;
#   do NOT add these to branch-protection required checks):
#     * client-quality — eslint + tsc --noEmit (advisory until the tree is clean)
#     * playwright     — end-to-end suite against a running stack (manual only)
#
# Why the CPU-only gate, and where the GPU crates are validated
# -------------------------------------------------------------
#   crates/visionclaw-gpu and the root visionclaw-server crate unconditionally
#   link the CUDA driver (cust / cudarc) and their kernel tests execute CUDA at
#   runtime, so they cannot build or run on a GPU-less GitHub-hosted runner.
#   Those crates are compiled and run on the developer's CUDA host as part of the
#   normal build/deploy workflow (./scripts/launch.sh), which is the authoritative
#   GPU validation — a self-hosted GPU CI runner added nothing at deploy time and
#   only queued indefinitely when offline, so the rust-gpu job was removed
#   2026-07-24. The other eight workspace crates (contracts, domain, protocol,
#   adapters, ontology, actors, xr-presence, analytics-oracle) are CUDA-free and
#   carry the bulk of the pure-logic test corpus, so they form the blocking gate
#   here. analytics-oracle (ADR-031 D7) holds the analytics correctness
#   known-answer suite (two_clique/pagerank/dbscan/lof) that previously sat in the
#   CUDA-linking root crate and therefore gated nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── BLOCKING ──────────────────────────────────────────────────────────────
  rust-fmt:
    name: Rust format (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      # rustfmt only parses source; it needs no CUDA and covers every crate,
      # including visionclaw-gpu and the root server crate.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  rust-cpu:
    name: Rust CPU crates — build, clippy, test (blocking)
    runs-on: ubuntu-latest
    env:
      # The CUDA-free workspace crates. The gpu crate and the root
      # visionclaw-server crate link libcuda and are covered by rust-gpu below.
      CPU_CRATES: >-
        -p visionclaw-contracts
        -p visionclaw-domain
        -p visionclaw-protocol
        -p visionclaw-adapters
        -p visionclaw-ontology
        -p visionclaw-actors
        -p visionclaw-xr-presence
        -p visionclaw-analytics-oracle
        -p vault-migrate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain (clippy)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - name: Install native build deps
        # oxigraph/oxrocksdb-sys (bindgen) and rusqlite `bundled` need clang +
        # cmake; the rest are already present on ubuntu-latest.
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo build (CPU crates)
        run: cargo build ${{ env.CPU_CRATES }}
      - name: cargo clippy (CPU crates)
        # Blocks on clippy hard errors (deny-by-default lints, compile errors).
        # Tighten to `-- -D warnings` once the existing warning backlog is cleared.
        run: cargo clippy ${{ env.CPU_CRATES }} --all-targets
      - name: cargo test (CPU crates)
        run: cargo test ${{ env.CPU_CRATES }}
      # visionclaw-integration-tests links no CUDA either, but four of its
      # test targets probe a live server / GPU. Build and lint the whole
      # crate; run only the two hermetic contract targets (ADR-2069 backup
      # posture, ADR-2008 dev build inputs). Until 2026-09-05 CI never saw
      # this crate or vault-migrate at all except through cargo fmt.
      - name: cargo clippy (integration-tests crate)
        run: cargo clippy -p visionclaw-integration-tests --all-targets
      - name: cargo test (hermetic integration contracts)
        run: cargo test -p visionclaw-integration-tests --test backup_posture --test dev_build_inputs

  client:
    name: Client Vitest (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: npm ci
        run: npm ci
      # `npm run test` == `vitest run`. Vitest does not import the cargo-generated
      # TypeScript types, so the suite runs without a Rust toolchain.
      - name: Vitest unit/component suite
        run: npm run test

  dev-auth-release-gate:
    name: ADR-2037 dev-auth excluded from release builds (blocking)
    runs-on: ubuntu-latest
    # Hermetic: no cargo, no docker, no network — pure text assertion over the
    # committed Dockerfiles/entrypoints, so this runs in seconds. ADR-2037
    # decided that production/release images must never carry the `dev-auth`
    # cargo feature (it compiles in the Bearer dev-session-token bypass and
    # stubs `enforce_release_env_hygiene` in src/main.rs to a no-op); this job
    # is the CI assertion ADR-2037 was missing. Record: ADR-2086.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert dev-auth never reaches a production/release build path
        run: |
          set -euo pipefail
          FAIL=0

          echo "== ADR-2037/ADR-2086: dev-auth must never enter a production/release build =="

          # 1) Neither production Dockerfile's --release cargo invocation may
          #    name the dev-auth feature (defence-in-depth, precise message).
          for f in Dockerfile.production Dockerfile.unified; do
            if grep -nE 'cargo (build|install)[^&]*--release' "$f" | grep -q 'dev-auth'; then
              echo "FAIL: $f has a --release cargo build line naming the dev-auth feature"
              FAIL=1
            fi
          done

          # 2) Belt-and-braces: dev-auth must not appear ANYWHERE in either
          #    Dockerfile. Both files' build-time RUN lines select features
          #    directly (no ARG FEATURES plumbing carries dev-auth into
          #    them) — dev-auth is only ever added by the dev-only runtime
          #    entrypoints checked below, never by an image build step.
          for f in Dockerfile.production Dockerfile.unified; do
            if grep -q 'dev-auth' "$f"; then
              echo "FAIL: $f references dev-auth — production/release images must be built without it (ADR-2037)"
              FAIL=1
            fi
          done

          # 3) The production runtime entrypoint (rebuilds the binary for the
          #    container's arch on start, prod-entrypoint.sh:9) must not
          #    carry dev-auth either.
          if grep -q 'dev-auth' scripts/prod-entrypoint.sh; then
            echo "FAIL: scripts/prod-entrypoint.sh references dev-auth — this is the production runtime path (ADR-2037)"
            FAIL=1
          fi

          # 4) Positive control: dev-auth MUST still be present on the
          #    dev-only rebuild path. If it is gone from here too, checks 1-3
          #    above would pass vacuously (the feature vanished everywhere
          #    rather than being correctly confined) — so failing to find it
          #    here is itself a failure, not a pass.
          #    Since ADR-2008/ADR-2038 the dev rebuild is performed by
          #    scripts/rust-backend-wrapper.sh (BUILD_FEATURES default), which
          #    dev-entrypoint.sh backgrounds; dev-entrypoint.sh itself no longer
          #    names the feature. Accept either file so the control follows the
          #    launcher, not one particular filename.
          if ! grep -q 'dev-auth' scripts/dev-entrypoint.sh scripts/rust-backend-wrapper.sh; then
            echo "FAIL: expected dev-auth on the dev-only rebuild path"
            echo "      (scripts/dev-entrypoint.sh or scripts/rust-backend-wrapper.sh)."
            echo "      Its absence means this gate can no longer tell a correctly-scoped dev-auth"
            echo "      from one that leaked into production — update this job's ADR-2037 review."
            FAIL=1
          fi

          # 5) The dev rebuild wrapper that carries dev-auth must never be wired
          #    into the production runtime path or the production image.
          for f in scripts/prod-entrypoint.sh Dockerfile.production; do
            if grep -q 'rust-backend-wrapper' "$f"; then
              echo "FAIL: $f invokes scripts/rust-backend-wrapper.sh, whose default BUILD_FEATURES include dev-auth (ADR-2037)"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "ADR-2037 violation: dev-auth must never compile into a production/release build."
            echo "It compiles in the Bearer dev-session-token auth bypass and stubs"
            echo "enforce_release_env_hygiene (src/main.rs) to a no-op boot check."
            echo ""
            echo "Fix: remove dev-auth from the offending build/entrypoint line above. dev-auth may"
            echo "only be added by scripts/dev-entrypoint.sh, scripts/rust-backend-wrapper.sh, or the"
            echo "dev-environment branch of scripts/launch.sh (ENVIRONMENT == dev)."
            echo "See docs/adr/ADR-2037-production-build-excludes-dev-auth.md and"
            echo "docs/adr/ADR-2086-ci-gate-dev-auth-excluded-from-release.md."
            exit 1
          fi

          echo "PASS: no production/release build path includes dev-auth (ADR-2037/ADR-2086)."

  # ── NON-BLOCKING (advisory / hardware-gated) ──────────────────────────────
  client-quality:
    name: Client lint + typecheck (advisory)
    runs-on: ubuntu-latest
    # Advisory only: the client tree has not yet been audited lint/type clean.
    # Promote to a blocking gate (remove continue-on-error, fold into `client`)
    # once eslint and `tsc --noEmit` both pass.
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: tsc --noEmit
        run: npx tsc --noEmit

  # rust-gpu job removed 2026-07-24: the GPU crates (visionclaw-gpu + the root
  # visionclaw-server) are compiled and run on the developer's CUDA host during
  # the normal build/deploy workflow, which is the authoritative validation. A
  # self-hosted GPU CI runner added nothing at deploy time and queued forever
  # when offline. Re-add only if a GPU runner is registered and real-hardware CI
  # is wanted; keep it non-blocking (continue-on-error, skip on pull_request).

  playwright:
    name: Client Playwright E2E (optional, manual)
    # The Playwright specs target a running stack: baseURL defaults to
    # http://localhost:3001 and playwright.config.ts sets `webServer: undefined`,
    # so the Rust backend + client must already be up. Manual-dispatch only —
    # set TEST_BASE_URL to point at the live stack. Optional: not a merge gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npm run test:e2e
